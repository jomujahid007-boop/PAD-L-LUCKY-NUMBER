<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PADEL SHOP — Lucky Number</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07131a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 450px;
      padding: 40px 25px;
      background: #102932;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      color: #d8ff4f;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .ball {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    p {
      color: #a9b8bd;
      font-size: 17px;
      line-height: 1.7;
    }

    .start {
      display: block;
      margin-top: 30px;
      padding: 17px;
      border-radius: 15px;
      background: #d8ff4f;
      color: #07131a;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      color: #71858c;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">PADEL SHOP</div>

    <div class="ball">🎾</div>

    <h1>LUCKY NUMBER</h1>

    <p>
      اختر رقمًا واحدًا<br>
      واكتشف جائزتك 🎁
    </p>

    <a
      class="start"
      href="https://script.google.com/macros/s/AKfycbyYvWo70hkG57tU_D58yqD6vnUlOKSkiWV0ElkJ9j8-xt4jjHkgLXJJBbF8sugJFNZy/exec"
    >
      🎯 ابدأ اللعبة
    </a>

    <div class="small">
      اضغط على الزر لبدء اللعبة
    </div>

  </div>

</body>
</html>
