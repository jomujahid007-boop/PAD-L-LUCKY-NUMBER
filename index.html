<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
  margin:0;
  background:#07131a;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:40px 20px
}

.logo{
  color:#d8ff4f;
  font-weight:900;
  letter-spacing:3px;
  font-size:18px
}

h1{
  font-size:34px;
  margin:20px 0 10px
}

.sub{
  color:#a9b8bd;
  margin-bottom:30px
}

.phone-box{
  background:#102932;
  border:1px solid #31515c;
  border-radius:20px;
  padding:25px;
  margin-top:20px
}

label{
  display:block;
  margin-bottom:12px;
  font-weight:bold
}

input{
  width:100%;
  box-sizing:border-box;
  background:#07131a;
  border:1px solid #45636d;
  color:#fff;
  border-radius:12px;
  padding:16px;
  font-size:20px;
  text-align:center;
  direction:ltr;
  outline:none
}

input:focus{
  border-color:#d8ff4f
}

.play{
  width:100%;
  margin-top:18px;
  border:0;
  background:#d8ff4f;
  color:#081017;
  border-radius:15px;
  padding:17px;
  font-size:20px;
  font-weight:900;
  cursor:pointer
}

.play:disabled{
  opacity:.5;
  cursor:not-allowed
}

.note{
  color:#7f969e;
  font-size:13px;
  margin-top:15px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10
}

.modal.show{
  display:flex
}

.box{
  background:#102932;
  border-radius:25px;
  padding:30px;
  max-width:430px;
  width:100%;
  box-sizing:border-box
}

.prize{
  font-size:32px;
  font-weight:900;
  color:#d8ff4f;
  margin:20px 0
}

.code{
  margin:18px 0;
  padding:14px;
  border:1px dashed #78909a;
  border-radius:10px;
  letter-spacing:2px;
  font-weight:bold;
  direction:ltr
}

.close{
  background:#d8ff4f;
  color:#081017;
  border:0;
  font-size:16px;
  padding:12px 24px;
  border-radius:10px;
  font-weight:bold
}

.loading{
  color:#a9b8bd
}

.error{
  color:#ff7b7b;
  font-weight:bold
}
</style>

</head>

<body>

<div class="wrap">

  <div class="logo">PAD-L SUITES</div>

  <h1>LUCKY NUMBER 🎾</h1>

  <div class="sub">
    أدخل رقم جوالك واحصل على فرصتك 🎁
  </div>

  <div class="phone-box">

    <label for="phone">
      رقم الجوال
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      autocomplete="tel"
      placeholder="05XXXXXXXX"
      maxlength="13"
    >

    <button
      class="play"
      id="play"
      onclick="playGame()"
    >
      🎁 جرّب حظك
    </button>

    <div class="note">
      فرصة واحدة فقط لكل رقم جوال
    </div>

  </div>

</div>


<div class="modal" id="m">

  <div class="box">

    <div id="s" class="loading">
      جاري الكشف...
    </div>

    <div class="prize" id="p">
      🎾
    </div>

    <div id="d"></div>

    <div class="code" id="c"></div>

    <button
      class="close"
      onclick="closeModal()"
    >
      إغلاق
    </button>

  </div>

</div>


<script>

const phoneInput = document.getElementById('phone');
const playButton = document.getElementById('play');

const modal = document.getElementById('m');
const statusText = document.getElementById('s');
const prizeText = document.getElementById('p');
const detailsText = document.getElementById('d');
const codeText = document.getElementById('c');


function playGame(){

  const phone = phoneInput.value.trim();

  if(!phone){

    alert('يرجى إدخال رقم الجوال');

    phoneInput.focus();

    return;
  }


  /*
    السماح بالأرقام السعودية فقط
    05XXXXXXXX
  */

  const cleanPhone =
    phone.replace(/\D/g,'');


  if(!/^05\d{8}$/.test(cleanPhone)){

    alert('يرجى إدخال رقم جوال سعودي صحيح');

    phoneInput.focus();

    return;
  }


  playButton.disabled = true;

  modal.classList.add('show');

  statusText.textContent = 'جاري الكشف...';

  statusText.className = 'loading';

  prizeText.textContent = '🎾';

  detailsText.textContent = '';

  codeText.textContent = '';


  google.script.run
    .withSuccessHandler(function(r){

      playButton.disabled = false;


      if(!r || !r.ok){

        statusText.textContent = 'تنبيه';

        statusText.className = 'error';

        prizeText.textContent = '⚠️';

        detailsText.textContent =
          r && r.message
            ? r.message
            : 'حدث خطأ، حاول مرة أخرى';

        codeText.textContent = '';

        return;
      }


      statusText.textContent = 'YOU WON!';

      statusText.className = '';

      prizeText.textContent = r.prize;

      detailsText.textContent =
        'اعرض هذا الكود للموظف عند الاستقبال';

      codeText.textContent = r.code;

    })
    .withFailureHandler(function(error){

      playButton.disabled = false;

      statusText.textContent = 'حدث خطأ';

      statusText.className = 'error';

      prizeText.textContent = '⚠️';

      detailsText.textContent =
        'تعذر الاتصال بالنظام. حاول مرة أخرى.';

      codeText.textContent = '';

      console.error(error);

    })
    .claimNumber(cleanPhone);

}


function closeModal(){

  modal.classList.remove('show');

}


phoneInput.addEventListener('keydown', function(e){

  if(e.key === 'Enter'){

    playGame();

  }

});

</script>

</body>
</html>
